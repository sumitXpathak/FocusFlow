plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.appblocker'
version = '0.1.0'

android {
  namespace "expo.modules.appblocker"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lint {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.12.0'
}
